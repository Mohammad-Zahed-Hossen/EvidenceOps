[project]
name = "evidenceops"
version = "0.1.0"
description = "EvidenceOps: Cost-Aware Retrieval and Evaluation Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "mcp>=1.2.0",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
]

[project.scripts]
evidenceops-ingest = "evidenceops.cli.ingest:main"
evidenceops-index = "evidenceops.cli.retrieval:index_main"
evidenceops-search = "evidenceops.cli.retrieval:search_main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "qdrant: Live Qdrant integration tests",
    "real_model: Real FastEmbed or FlashRank model smoke tests",
]
